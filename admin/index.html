<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Fin360° — Admin</title>
<link rel="icon" type="image/png" href="../assets/img/emblema.png" />
<link rel="stylesheet" href="../assets/css/styles.css" />
<style>
  /* A trava de verdade é a função admin_listar_usuarios() no banco (checa o e-mail
     do token); esta página só decide o que MOSTRAR. Ver supabase/sql/admin_listar_usuarios.sql. */
  body { background: var(--bg); min-height: 100vh; }
  .admin-wrap { max-width: 1040px; margin: 0 auto; padding: 34px 24px 60px; }
  .admin-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .admin-top h1 { font-size: 20px; font-weight: 800; }
  .admin-top .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .admin-panel {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px; box-shadow: var(--shadow-card);
  }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); font-weight: 700; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .admin-table td { padding: 12px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  .admin-table tr:last-child td { border-bottom: none; }
  .admin-email { font-weight: 700; }
  .admin-muted { color: var(--text-faint); font-size: 12px; }
  .admin-plataforma { color: var(--text-faint); font-size: 11px; display: block; margin-top: 2px; }
  .admin-estado { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; text-align: center; color: var(--text-muted); }
  .admin-center { display: flex; justify-content: center; padding: 60px 0; }
  .admin-login { max-width: 360px; margin: 60px auto 0; }
</style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-top">
      <div>
        <h1>Fin360° · Admin</h1>
        <div class="sub" id="admin-sub">Carregando…</div>
      </div>
      <div id="admin-acoes"></div>
    </div>
    <div id="admin-conteudo"></div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>

  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
